version: 2

project_name: goban-connector

before:
  hooks:
    - go test ./...

builds:
  - id: goban-connector
    main: ./cmd/goban-connector
    binary: goban-connector
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: goban-connector
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name, so that
    # https://github.com/oduvan/lyabah-go-connector/releases/latest/download/goban-connector_linux_amd64.tar.gz
    # always gives the newest release. Goban's setup guide links to these
    # addresses.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true
